syntax = "proto3";

package sql.v1;

import "google/protobuf/any.proto";

option go_package = "github.com/litesql/go-ha/api/sql/v1;sqlv1";

service DatabaseService {
  rpc Query(stream QueryRequest) returns (stream QueryResponse) {}
  rpc DataSourceNames(DataSourceNamesRequest) returns (DataSourceNamesResponse) {}
  rpc Download(DownloadRequest) returns (stream DownloadResponse) {}
  rpc LatestSnapshot(LatestSnapshotRequest) returns (stream LatestSnapshotResponse) {}
  rpc ReplicationIDs(ReplicationIDsRequest) returns (ReplicationIDsResponse) {}
  rpc ChangeSet(stream ChangeSetRequest) returns (stream ChangeSetResponse) {}    
}

enum QueryType {
  QUERY_TYPE_UNSPECIFIED = 0;
  QUERY_TYPE_EXEC_UPDATE = 1;
  QUERY_TYPE_EXEC_QUERY = 2;
  QUERY_TYPE_PING = 3;
}

message QueryRequest {
  QueryType type = 1;
  string sql = 2;
  repeated NamedValue params = 3;
  string replication_id = 4;
}

message NamedValue {
  string name = 1;
  int64 ordinal = 2;
  google.protobuf.Any value = 3;
}

message QueryResponse {
  Data result_set = 1;
  int64 rows_affected = 2;
  int64 last_insert_id = 3;
  uint64 txseq = 4;
  string error = 5;
}

message Data {
  repeated string columns = 1;
  repeated Row rows = 2;
}

message Row {
  repeated google.protobuf.Any values = 1;
}

message DataSourceNamesRequest {}

message DataSourceNamesResponse {
  repeated string dsn = 1;
}

message DownloadRequest {
  string replication_id = 1;
}

message DownloadResponse {
  bytes data = 1;
}

message LatestSnapshotRequest {
  string replication_id = 1;
}

message LatestSnapshotResponse {  
  bytes data = 1;
}

message ReplicationIDsRequest {}

message ReplicationIDsResponse {
  repeated string replication_id = 1;
}

message ChangeSetRequest {
  string id = 1;
  CangeSetRequestType type = 2;
  string node = 3;
  string replication_id = 4;
  int64 timestamp_ns = 5;
  string strategy = 6;
  repeated Change changes = 7;
}

enum CangeSetRequestType {
  CHANGESET_REQUEST_TYPE_PING = 0;
  CHANGESET_REQUEST_TYPE_PREPARE = 1;
  CHANGESET_REQUEST_TYPE_COMMIT = 2;
  CHANGESET_REQUEST_TYPE_ABORT = 3;  
  CHANGESET_REQUEST_TYPE_UNDO = 4;  
}

message ChangeSetResponse {
  string error = 1;
}

message Change {
  string database = 1;
  string table = 2;
  repeated string columns = 3;
  repeated string pk_columns = 4;
  string operation = 5;
  int64 old_rowid = 6;
  int64 new_rowid = 7;
  repeated google.protobuf.Any old_values = 8;
  repeated google.protobuf.Any new_values = 9;
  string command = 10;
  repeated google.protobuf.Any args = 11;
  int64 ts_ns = 12;
}